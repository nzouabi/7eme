<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz – Technologies Internet (7ème année)</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#6a11cb 0%,#2575fc 100%);color:#2d3142}
.card{background:#fff;width:100%;max-width:640px;border-radius:24px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
h1{font-size:1.6rem;text-align:center;color:#4b2fb8}
.sub{text-align:center;color:#6b7280;margin:6px 0 18px}
.big{font-size:4rem;text-align:center}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:1.05rem;font-weight:700;color:#fff;background:linear-gradient(90deg,#ff7e5f,#feb47b);cursor:pointer;margin-top:16px;transition:transform .15s}
.btn:hover{transform:scale(1.02)}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:#4b2fb8;margin-bottom:8px}
.bar{height:12px;background:#e8e4fb;border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar div{height:100%;width:0;background:linear-gradient(90deg,#43e97b,#38f9d7);border-radius:99px;transition:width .4s}
.img{background:#f1f5ff;border-radius:16px;padding:8px;margin-bottom:6px}
.img svg{width:100%;height:auto;display:block}
.cap{font-size:.85rem;text-align:center;color:#6b7280;margin-bottom:14px;font-style:italic}
.q{font-size:1.15rem;font-weight:700;margin-bottom:12px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#f8f9ff;border:2px solid #d9defa;border-radius:14px;padding:12px;margin-bottom:10px;font-size:1rem;cursor:pointer;color:inherit;transition:.15s}
.opt:hover:not(:disabled){border-color:#6a11cb;background:#efe9ff;transform:translateX(4px)}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:#6a11cb;color:#fff;display:grid;place-items:center}
.opt.ok{background:#d9f8e3;border-color:#22c55e}.opt.ok b{background:#22c55e}
.opt.ko{background:#ffe1e1;border-color:#ef4444}.opt.ko b{background:#ef4444}
.opt:disabled{cursor:default}
.fb{display:none;border-radius:14px;padding:12px;margin-top:6px;font-size:.95rem;line-height:1.45}
.fb.ok{display:block;background:#e9fbef;color:#166534}.fb.ko{display:block;background:#fff1f1;color:#991b1b}
.hide{display:none}
.score{font-size:3rem;font-weight:800;text-align:center;color:#4b2fb8}
.stars{font-size:2.2rem;text-align:center;letter-spacing:6px}
.msg{text-align:center;font-size:1.1rem;margin-top:8px}
</style>
</head>
<body>
<div class="card" id="app"></div>

<script>
const S=(c)=>`<svg viewBox="0 0 300 140" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Arial,sans-serif">${c}</svg>`;

const QUESTIONS=[
{
 img:S(`<g stroke="#6a11cb" stroke-width="2" stroke-dasharray="5 4"><line x1="150" y1="70" x2="50" y2="30"/><line x1="150" y1="70" x2="250" y2="30"/><line x1="150" y1="70" x2="50" y2="112"/><line x1="150" y1="70" x2="250" y2="112"/></g><circle cx="150" cy="70" r="34" fill="#dbeafe" stroke="#2575fc" stroke-width="3"/><text x="150" y="82" font-size="36" text-anchor="middle">🌍</text><text x="50" y="40" font-size="30" text-anchor="middle">💻</text><text x="250" y="40" font-size="30" text-anchor="middle">📱</text><text x="50" y="122" font-size="30" text-anchor="middle">🖥️</text><text x="250" y="122" font-size="30" text-anchor="middle">📲</text>`),
 cap:"Des millions d’appareils reliés entre eux dans le monde entier.",
 q:"Qu’est-ce qu’Internet ?",
 opts:["Un réseau mondial qui relie des millions d’ordinateurs et d’appareils","Un logiciel installé sur l’ordinateur","Un site Web très connu","Un moteur de recherche"],
 ok:0,
 exp:"Internet est un réseau mondial qui permet l’échange d’informations et la communication entre les utilisateurs."
},
{
 img:S(`<rect x="30" y="10" width="240" height="120" rx="10" fill="#fff" stroke="#2575fc" stroke-width="3"/><rect x="30" y="10" width="240" height="30" rx="10" fill="#dbeafe"/><circle cx="47" cy="25" r="5" fill="#ef4444"/><circle cx="63" cy="25" r="5" fill="#f59e0b"/><circle cx="79" cy="25" r="5" fill="#22c55e"/><rect x="95" y="17" width="160" height="16" rx="8" fill="#fff" stroke="#93c5fd"/><text x="105" y="29" font-size="10" fill="#4b5563">www.exemple.tn</text><rect x="50" y="55" width="200" height="12" rx="4" fill="#e5e7eb"/><rect x="50" y="75" width="150" height="12" rx="4" fill="#e5e7eb"/><rect x="50" y="95" width="180" height="12" rx="4" fill="#e5e7eb"/><text x="150" y="6" font-size="9" text-anchor="middle" fill="#6a11cb" font-weight="700">Fenêtre d’un navigateur Web</text>`),
 cap:"Un navigateur affiche les pages des sites Web : barre d’adresse, onglets, page…",
 q:"Parmi ces éléments, lequel est un navigateur Web ?",
 opts:["Google","Bing","Google Chrome","Gemini"],
 ok:2,
 exp:"Google Chrome est un navigateur Web, tandis que Google est un moteur de recherche."
},
{
 img:S(`<rect x="40" y="18" width="220" height="34" rx="17" fill="#fff" stroke="#2575fc" stroke-width="3"/><text x="60" y="41" font-size="14" fill="#374151">avantages d’Internet</text><circle cx="235" cy="35" r="9" fill="none" stroke="#6a11cb" stroke-width="3"/><line x1="242" y1="42" x2="249" y2="49" stroke="#6a11cb" stroke-width="3"/><g fill="#e5e7eb"><rect x="40" y="68" width="200" height="10" rx="4"/><rect x="40" y="86" width="170" height="10" rx="4"/><rect x="40" y="104" width="185" height="10" rx="4"/></g><g fill="#2575fc"><rect x="40" y="62" width="60" height="4" rx="2"/><rect x="40" y="80" width="60" height="4" rx="2"/><rect x="40" y="98" width="60" height="4" rx="2"/></g>`),
 cap:"On tape des mots-clés et le moteur affiche une liste de résultats.",
 q:"À quoi sert un moteur de recherche (Google, Bing, DuckDuckGo…) ?",
 opts:["À écrire des documents Word","À trouver des informations sur le Web à partir de mots-clés","À brancher un ordinateur à Internet","À dessiner des images"],
 ok:1,
 exp:"Un moteur de recherche est un outil en ligne qui permet de trouver des informations sur le Web à partir de mots-clés."
},
{
 img:S(`<rect x="15" y="40" width="270" height="60" rx="14" fill="#fff" stroke="#6a11cb" stroke-width="3"/><text x="28" y="76" font-size="12.5" fill="#374151">Quels sont les <tspan fill="#b45309" font-weight="800" style="text-decoration:underline">dangers</tspan> d’<tspan fill="#b45309" font-weight="800" style="text-decoration:underline">Internet</tspan> pour les enfants ?</text><text x="150" y="24" font-size="12" text-anchor="middle" fill="#6a11cb" font-weight="700">Les mots importants = les mots-clés</text><text x="150" y="124" font-size="22" text-anchor="middle">🔑</text>`),
 cap:"Les mots-clés représentent le sujet de la recherche.",
 q:"Dans la requête « Quels sont les dangers d’Internet pour les enfants ? », quels sont les mots-clés ?",
 opts:["Quels – sont – les","Pour – les","Dangers – Internet","Sont – pour"],
 ok:2,
 exp:"Un mot-clé est un mot (ou un groupe de mots) qui représente le sujet de la recherche : ici « Dangers Internet »."
},
{
 img:S(`<rect x="15" y="12" width="110" height="28" rx="14" fill="#fff" stroke="#9ca3af" stroke-width="2"/><text x="70" y="31" font-size="12" text-anchor="middle" fill="#4b5563">Pollution</text><rect x="165" y="12" width="125" height="28" rx="14" fill="#fff" stroke="#22c55e" stroke-width="2"/><text x="227" y="31" font-size="9.5" text-anchor="middle" fill="#166534">Causes de la pollution de l’eau</text><path d="M128 26 L160 26" stroke="#6a11cb" stroke-width="3" marker-end="url(#a)"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#6a11cb"/></marker></defs><g fill="#d1d5db"><rect x="20" y="55" width="40" height="10" rx="3"/><rect x="70" y="55" width="40" height="10" rx="3"/><rect x="20" y="72" width="40" height="10" rx="3"/><rect x="70" y="72" width="40" height="10" rx="3"/><rect x="20" y="89" width="40" height="10" rx="3"/><rect x="70" y="89" width="40" height="10" rx="3"/></g><text x="70" y="122" font-size="10" text-anchor="middle" fill="#6b7280">Résultats variés 😕</text><g fill="#86efac"><rect x="175" y="55" width="105" height="12" rx="3"/><rect x="175" y="73" width="105" height="12" rx="3"/></g><text x="227" y="122" font-size="10" text-anchor="middle" fill="#166534">Résultats précis 🎯</text>`),
 cap:"Une requête précise donne des résultats plus adaptés.",
 q:"Pour obtenir des résultats plus précis sur « Pollution », quelle recherche affinée est la meilleure ?",
 opts:["Pollution","Environnement","Pollution pollution","Causes de la pollution de l’eau"],
 ok:3,
 exp:"Affiner une requête, c’est préciser les mots-clés pour obtenir des résultats plus pertinents."
},
{
 img:S(`<text x="75" y="85" font-size="62" text-anchor="middle">🤖</text><rect x="125" y="22" width="165" height="62" rx="14" fill="#ede9fe" stroke="#6a11cb" stroke-width="2.5"/><path d="M125 60 L108 72 L128 70z" fill="#ede9fe" stroke="#6a11cb" stroke-width="2.5" stroke-linejoin="round"/><text x="207" y="48" font-size="11" text-anchor="middle" fill="#4b2fb8">Voici ma réponse…</text><text x="207" y="68" font-size="11" text-anchor="middle" fill="#b91c1c" font-weight="700">⚠️ elle peut être fausse !</text><text x="207" y="115" font-size="11" text-anchor="middle" fill="#166534" font-weight="700">✅ Je vérifie sur des sources fiables</text>`),
 cap:"L’IA est un outil complémentaire, pas une source infaillible.",
 q:"Un outil d’intelligence artificielle (IA) te donne une réponse. Que dois-tu faire ?",
 opts:["La croire sans vérifier","La copier directement dans ton devoir","Vérifier l’information auprès de sources fiables","Ne jamais utiliser l’IA"],
 ok:2,
 exp:"Les réponses de l’IA peuvent contenir des erreurs : il faut toujours vérifier les informations auprès de sources fiables."
},
{
 img:S(`<g font-size="13" fill="#374151"><rect x="40" y="10" width="220" height="30" rx="10" fill="#dcfce7"/><text x="55" y="30">✅  La source (qui a publié ?)</text><rect x="40" y="48" width="220" height="30" rx="10" fill="#dbeafe"/><text x="55" y="68">📅  La date de publication</text><rect x="40" y="86" width="220" height="30" rx="10" fill="#fef3c7"/><text x="55" y="106">🔍  La comparaison de plusieurs sites</text></g><text x="150" y="132" font-size="10" text-anchor="middle" fill="#6b7280">Source • Date • Fiabilité • Comparaison</text>`),
 cap:"Les bons réflexes avant d’utiliser une information.",
 q:"Pour vérifier la fiabilité d’une information trouvée sur Internet, que faut-il examiner ?",
 opts:["La couleur du site Web","La source, la date et la comparaison avec d’autres sites","Seulement le premier résultat de Google","Le nombre d’images de la page"],
 ok:1,
 exp:"Il faut vérifier la source, la date, la fiabilité du site et comparer la même information sur plusieurs sites."
}
];

const app=document.getElementById("app");
const TOTAL=QUESTIONS.length;
let idx=0,score=0,order=[];

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function start(){
 app.innerHTML=`<div class="big">🚀</div><h1>Quiz : Technologies Internet</h1>
 <p class="sub">7ème année • ${TOTAL} questions • noté sur ${TOTAL}</p>
 <p class="msg">Lis bien chaque question, observe l’image et choisis la bonne réponse. Tu peux le faire, courage ! 💪</p>
 <button class="btn" id="go">C’est parti !</button>`;
 document.getElementById("go").onclick=()=>{idx=0;score=0;show()};
}

function show(){
 const q=QUESTIONS[idx];
 order=shuffle(q.opts.map((t,i)=>({t,i})));
 const letters=["A","B","C","D"];
 app.innerHTML=`<div class="top"><span>Question ${idx+1} / ${TOTAL}</span><span>⭐ ${score}</span></div>
 <div class="bar"><div style="width:${idx/TOTAL*100}%" id="pb"></div></div>
 <div class="img">${q.img}</div><p class="cap">${q.cap}</p>
 <p class="q">${q.q}</p>
 <div id="opts">${order.map((o,k)=>`<button class="opt" data-k="${k}"><b>${letters[k]}</b><span>${o.t}</span></button>`).join("")}</div>
 <div class="fb" id="fb"></div>
 <button class="btn hide" id="next">${idx===TOTAL-1?"Voir mon résultat 🏆":"Question suivante ➜"}</button>`;
 requestAnimationFrame(()=>document.getElementById("pb").style.width=(idx/TOTAL*100)+"%");
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
 document.getElementById("next").onclick=()=>{idx++;idx<TOTAL?show():end()};
}

function answer(k){
 const q=QUESTIONS[idx],good=order[k].i===q.ok;
 if(good)score++;
 app.querySelectorAll(".opt").forEach((b,n)=>{b.disabled=true;if(order[n].i===q.ok)b.classList.add("ok");else if(n===k)b.classList.add("ko")});
 const fb=document.getElementById("fb");
 fb.className="fb "+(good?"ok":"ko");
 fb.innerHTML=(good?"🎉 <b>Bravo, bonne réponse !</b> ":"💡 <b>Pas tout à fait, mais tu apprends !</b> ")+q.exp;
 document.getElementById("pb").style.width=((idx+1)/TOTAL*100)+"%";
 document.getElementById("next").classList.remove("hide");
}

function end(){
 const stars="⭐".repeat(score)+"☆".repeat(TOTAL-score);
 let emoji="💪",msg="Continue à t’entraîner, tu vas y arriver !";
 if(score===TOTAL){emoji="🏆";msg="Parfait ! Tu es un(e) vrai(e) expert(e) d’Internet !"}
 else if(score>=5){emoji="🎉";msg="Excellent travail ! Tu maîtrises très bien le sujet."}
 else if(score>=4){emoji="👏";msg="Bien joué ! Encore un petit effort pour la perfection."}
 app.innerHTML=`<div class="big">${emoji}</div><h1>Quiz terminé !</h1>
 <p class="score">${score} / ${TOTAL}</p><p class="stars">${stars}</p>
 <p class="msg">${msg}</p>
 <button class="btn" id="again">Recommencer 🔄</button>`;
 document.getElementById("again").onclick=start;
}
start();
</script>
</body>
</html>
